services:
  dev:
    restart: always
    user: etovaz
    build:
      context: ./docker/dev
      dockerfile: Dockerfile
      args:
        USER_NAME: etovaz
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    volumes:
      - ${HOME}/.p10k.zsh:/home/etovaz/.p10k.zsh
      - ${HOME}/.zsh_history:/home/etovaz/.zsh_history
      - ./:/home/etovaz/documentos/career-mcp
      - ${HOME}/.claude:/home/etovaz/.claude
      - ${HOME}/.claude.json:/home/etovaz/.claude.json
      - ${HOME}/.config/anthropic:/home/etovaz/.config/anthropic
      - ${HOME}/.config/gh:/home/etovaz/.config/gh
      - ${HOME}/.ssh:/home/etovaz/.ssh
      - ${HOME}/.local/share/mise/installs/github-akitaonrails-ai-memory:/home/etovaz/.local/share/mise/installs/github-akitaonrails-ai-memory:ro
      - ${HOME}/.local/share/ai-memory:/home/etovaz/.local/share/ai-memory

  # Servidor com hot reload (tsx watch) sobre o mesmo código do dev. O .env é
  # lido pelo próprio app; data/, output/ e cache/ ficam no projeto.
  # Do dev: http://app:3000. Do host: http://127.0.0.1:3001.
  app:
    image: node:25
    restart: always
    user: ${UID:-1000}:${GID:-1000}
    working_dir: /home/etovaz/documentos/career-mcp
    command: npm run dev
    volumes:
      - ./:/home/etovaz/documentos/career-mcp
    ports:
      - 127.0.0.1:3001:3000
